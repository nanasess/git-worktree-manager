name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least-privilege token. The self-repo smoke tests need read access to the
# running repository's PRs and issues so `gh pr view` / `gh issue view`
# succeed under the default GITHUB_TOKEN. No external PAT is used.
permissions:
  contents: read
  pull-requests: read
  issues: read

jobs:
  test-deps:
    # Unit tests for lib/deps.sh. No network and no clone, so they run on both
    # platforms cheaply.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: true
      - name: Install modern Bash (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install bash
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"
      - name: Run deps unit tests
        run: ./test/bats/bin/bats test/deps.bats

  test-single-repo:
    # Run on both Linux and macOS: macOS ships BSD userland (e.g. readlink
    # without -f), so it guards against Linux-only assumptions in the scripts.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: true
      - name: Install modern Bash (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install bash
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"
      - name: Run single-repo tests
        run: ./test/bats/bin/bats test/single_repo.bats

  test-multi-repo:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: true
      - name: Install modern Bash (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install bash
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"
      - name: Run multi-repo tests
        run: ./test/bats/bin/bats test/multi_repo.bats

  test-self-repo-smoke:
    runs-on: ubuntu-latest
    env:
      # gh reads GH_TOKEN for API calls. Use the scoped GITHUB_TOKEN so the
      # smoke tests can query this repository's own PRs/issues.
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: true
      - name: Run self-repo smoke tests
        run: ./test/bats/bin/bats test/self_repo_smoke.bats
