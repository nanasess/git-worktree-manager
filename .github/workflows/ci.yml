name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-single-repo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          submodules: true
      - name: Run single-repo tests
        run: ./test/bats/bin/bats test/single_repo.bats

  test-multi-repo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          submodules: true
      - name: Run multi-repo tests
        run: ./test/bats/bin/bats test/multi_repo.bats
